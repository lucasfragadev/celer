services:
  # ─── Banco de Dados PostgreSQL ────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: celer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: celer_user
      POSTGRES_PASSWORD: celer_pass
      POSTGRES_DB: celer_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - celer_pgdata:/var/lib/postgresql/data
      # Executa o SQL de fundação automaticamente na primeira vez
      - ./migrations/00_foundation.sql:/docker-entrypoint-initdb.d/00_foundation.sql
      - ./migrations/01_historicos_beneficios.sql:/docker-entrypoint-initdb.d/01_historicos_beneficios.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U celer_user -d celer_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API Node.js ──────────────────────────────────────────
  api:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    container_name: celer_api
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      PORT: 3333
      DATABASE_URL: postgres://celer_user:celer_pass@postgres:5432/celer_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  celer_pgdata:
