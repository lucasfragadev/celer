<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celer SaaS — Backoffice</title>
<style>
:root {
  --ink:#18202B; --muted:#5C6675; --paper:#F5F7F9; --surface:#FFFFFF; --line:#E4E8ED;
  --accent:#0E7C6B; --accent-weak:#E6F1EF; --accent-ink:#0A5A4E;
  --danger:#B4232B;
  --radius:10px; --shadow:0 1px 2px rgba(24,32,43,.06),0 4px 16px rgba(24,32,43,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
header.top{background:var(--ink);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;}
header.top .brand{font-weight:650;letter-spacing:.2px}
header.top .brand b{color:#7FD8C7}
main{max-width:960px;margin:40px auto;padding:0 22px}
h2.title{font-size:19px;margin:0 0 4px;font-weight:640}
p.lead{color:var(--muted);margin:0 0 18px;font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.card.pad{padding:22px;}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);background:#F9FAFB}
td{padding:12px 16px;border-bottom:1px solid #EEF1F4;font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
button.primary{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
button.primary:hover{background:var(--accent-ink)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:600}
button.ghost:hover{background:var(--paper)}
.tools{display:flex;justify-content:space-between;margin-bottom:16px;}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.field input{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:14px;font-family:inherit}
.field input:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
.modal-bg{position:fixed;inset:0;background:rgba(24,32,43,.42);display:none;align-items:center;justify-content:center;z-index:40;padding:18px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:460px;}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:640;font-size:16px}
.modal .mb{padding:20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#F9FAFB;border-radius:0 0 12px 12px}
.badge{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:600;background:var(--accent-weak);color:var(--accent-ink)}
</style>
</head>
<body>
<!-- LOGIN OVERLAY -->
<div id="loginOverlay" style="position:fixed;inset:0;background:var(--ink);z-index:9999;display:flex;align-items:center;justify-content:center;">
  <div style="background:var(--surface);padding:40px;border-radius:12px;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,0.5)">
    <h2 style="margin:0 0 8px;font-size:24px;text-align:center">Celer Backoffice</h2>
    <p style="margin:0 0 24px;color:var(--muted);font-size:14px;text-align:center">Acesso restrito a Super-Admins</p>
    <div class="field">
      <label>E-mail</label>
      <input type="email" id="loginEmail" placeholder="admin@lites.com.br">
    </div>
    <div class="field" style="margin-bottom:24px">
      <label>Senha</label>
      <input type="password" id="loginSenha" onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <button type="button" class="primary" style="width:100%" onclick="doLogin()">Entrar no Backoffice</button>
    <div id="loginError" style="color:var(--danger);font-size:13px;text-align:center;margin-top:12px;display:none"></div>
  </div>
</div>

<header class="top">
  <div class="brand">Celer <b>Backoffice</b></div>
  <div style="flex:1"></div>
  <button type="button" class="ghost" style="color:#fff;border-color:#3A4552" onclick="doLogout()">Sair</button>
</header>

<main>
  <div class="tools">
    <div>
      <h2 class="title">Empresas (Tenants)</h2>
      <p class="lead">Gerenciamento de clientes do sistema.</p>
    </div>
    <div>
      <button type="button" class="primary" onclick="openTenantModal()">+ Nova Empresa</button>
    </div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome da Empresa</th>
          <th>CNPJ</th>
          <th>Status</th>
          <th>Criado em</th>
        </tr>
      </thead>
      <tbody id="tenantRows">
        <tr><td colspan="5" style="text-align:center;color:#888">Carregando...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<div class="modal-bg" id="tenantModalBg">
  <div class="modal">
    <div class="mh">Cadastrar Nova Empresa</div>
    <div class="mb">
      <div class="field"><label>Nome da Empresa</label><input type="text" id="tNome" placeholder="Ex: Acme Corp"></div>
      <div class="field"><label>CNPJ (Opcional)</label><input type="text" id="tCnpj" placeholder="00.000.000/0001-00"></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
      <p style="font-size:13px;color:var(--muted);margin-top:0;font-weight:600">Primeiro Usuário (Master)</p>
      <div class="field"><label>Nome do Usuário</label><input type="text" id="tUserNome" placeholder="Ex: João Silva"></div>
      <div class="field"><label>E-mail do Usuário</label><input type="email" id="tUserEmail" placeholder="joao@acme.com.br"></div>
      <div class="field"><label>Senha de Acesso</label><input type="password" id="tUserSenha" placeholder="••••••••"></div>
      <div id="tError" style="color:var(--danger);font-size:13px;display:none;margin-top:8px"></div>
    </div>
    <div class="mf">
      <button type="button" class="ghost" onclick="closeTenantModal()">Cancelar</button>
      <button type="button" class="primary" id="btnSave" onclick="saveTenant()">Criar Empresa</button>
    </div>
  </div>
</div>

<script>
const celerApi = {
  _base: '/api',
  _headers() {
    return { 'Content-Type': 'application/json' };
  },
  async get(path) {
    try {
      const r = await fetch(this._base + path, { credentials: 'include', headers: this._headers() });
      if (r.status === 401 || r.status === 403) { showLogin(); return null; }
      const d = await r.json(); return d.success ? d.data : null;
    } catch(e) { return null; }
  },
  async post(path, body) {
    try {
      const r = await fetch(this._base + path, { method: 'POST', credentials: 'include', headers: this._headers(), body: JSON.stringify(body) });
      const d = await r.json();
      if (!d.success) throw new Error(d.error);
      return d.data;
    } catch(e) { throw e; }
  }
};

function $(id) { return document.getElementById(id); }

function showLogin() { $('loginOverlay').style.display = 'flex'; }
function hideLogin() { $('loginOverlay').style.display = 'none'; }

async function checkAuth() {
  const tenants = await celerApi.get('/admin/tenants');
  if (tenants) {
    hideLogin();
    renderTenants(tenants);
  }
}

async function doLogin() {
  const email = $('loginEmail').value.trim();
  const senha = $('loginSenha').value;
  $('loginError').style.display = 'none';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha })
    });
    const d = await res.json();
    if (!d.success) { $('loginError').innerText = d.error; $('loginError').style.display = 'block'; return; }
    if (!d.data.usuario.admin_global) { $('loginError').innerText = "Acesso negado: Requer privilégios de Super-Admin."; $('loginError').style.display = 'block'; return; }
    
    hideLogin();
    loadTenants();
  } catch (err) {
    $('loginError').innerText = "Erro ao conectar.";
    $('loginError').style.display = 'block';
  }
}

function doLogout() {
  document.cookie = 'celer_token=; Max-Age=0; path=/';
  location.reload();
}

async function loadTenants() {
  const tenants = await celerApi.get('/admin/tenants');
  if (tenants) {
    renderTenants(tenants);
  }
}

function renderTenants(tenants) {
  const tbody = $('tenantRows');
  if (tenants.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888">Nenhuma empresa cadastrada.</td></tr>';
    return;
  }
  
  tbody.innerHTML = tenants.map(t => `
    <tr>
      <td style="font-family:monospace;color:var(--muted)">${t.id.split('-')[0]}...</td>
      <td style="font-weight:600">${t.nome}</td>
      <td>${t.cnpj || '-'}</td>
      <td><span class="badge">${t.ativo ? 'Ativo' : 'Inativo'}</span></td>
      <td style="color:var(--muted)">${new Date(t.criado_em).toLocaleDateString('pt-BR')}</td>
      <td><button class="ghost" style="padding:4px 8px;font-size:12px" onclick="impersonate('${t.id}')">Acessar</button></td>
    </tr>
  `).join('');
}

function impersonate(tenantId) {
  localStorage.setItem('celerImpersonateTenant', tenantId);
  window.location.href = '/'; // Redireciona para o app.html (raiz)
}

function openTenantModal() {
  $('tNome').value = ''; $('tCnpj').value = '';
  $('tUserNome').value = ''; $('tUserEmail').value = ''; $('tUserSenha').value = '';
  $('tError').style.display = 'none';
  $('tenantModalBg').classList.add('show');
}

function closeTenantModal() {
  $('tenantModalBg').classList.remove('show');
}

function formatCnpj(v) {
  v=v.replace(/\D/g,"");
  if(v.length>14) v=v.slice(0,14);
  v=v.replace(/^(\d{2})(\d)/,"$1.$2");
  v=v.replace(/^(\d{2})\.(\d{3})(\d)/,"$1.$2.$3");
  v=v.replace(/\.(\d{3})(\d)/,".$1/$2");
  v=v.replace(/(\d{4})(\d)/,"$1-$2");
  return v;
}

// Attach listener if you want real-time mask, or just validate.
document.getElementById('tCnpj').addEventListener('input', function(e) {
  e.target.value = formatCnpj(e.target.value);
});

async function saveTenant() {
  const btn = $('btnSave');
  const cnpjRaw = $('tCnpj').value.trim();
  const cnpjClean = cnpjRaw.replace(/\D/g, '');
  
  if (cnpjClean && cnpjClean.length !== 14 && cnpjClean !== '00000000000000') {
    $('tError').innerText = "CNPJ inválido. Digite 14 números.";
    $('tError').style.display = 'block';
    return;
  }

  const payload = {
    nome: $('tNome').value.trim(),
    cnpj: cnpjClean ? cnpjRaw : '',
    nomeUsuario: $('tUserNome').value.trim(),
    email: $('tUserEmail').value.trim(),
    senha: $('tUserSenha').value
  };
  
  if (!payload.nome || !payload.nomeUsuario || !payload.email || !payload.senha) {
    $('tError').innerText = "Preencha todos os campos obrigatórios.";
    $('tError').style.display = 'block';
    return;
  }
  
  btn.disabled = true; btn.innerText = "Criando..."; $('tError').style.display = 'none';
  try {
    await celerApi.post('/admin/tenants', payload);
    closeTenantModal();
    loadTenants();
  } catch (err) {
    $('tError').innerText = err.message;
    $('tError').style.display = 'block';
  } finally {
    btn.disabled = false; btn.innerText = "Criar Empresa";
  }
}

// Inicia tentando carregar tenants para checar o login implicitamente
checkAuth();
</script>
</body>
</html>
